<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日晷互动演示：古代的光传感器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f0e6 0%, #e8d9c4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            max-width: 900px;
            width: 100%;
            padding: 30px;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #5a4027;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #8b7355;
            font-size: 16px;
        }

        .main-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        /* 日晷舞台（完全保留原尺寸样式） */
        .stage {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #f0e8d9, #d4c4a8);
            border-radius: 50%;
            border: 4px solid #8b6914;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .compass-base {
            width: 240px;
            height: 240px;
            background: #b8860b;
            border-radius: 50%;
            position: absolute;
            opacity: 0.3;
        }

        /* 视频占位区域 */
        .video-placeholder {
            width: 260px;
            height: 200px;
            background: #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
            z-index: 10;
        }

        /* 控制区（完全保留原样式） */
        .magnet-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            background: #8b6914;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #a67c00;
            transform: translateY(-2px);
        }

        /* 讲解弹窗（完全不变） */
        .dialogue-box {
            background: #f9f6f0;
            border-radius: 12px;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            border: 2px solid #e0d2b8;
            position: relative;
            display: none;
        }

        .dialogue-box.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dialogue-text {
            color: #444;
            line-height: 1.8;
            font-size: 16px;
        }

        .dialogue-text .highlight {
            color: #8b4513;
            font-weight: bold;
        }

        /* 教学目标卡片 */
        .target-card {
            background: #f0e8d9;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .target-card h3 {
            color: #5a4027;
            margin-bottom: 10px;
        }

        .target-card p {
            color: #555;
            line-height: 1.6;
        }

        @media (max-width: 700px) {
            .main-area {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>古代的智慧：日晷演示</h1>
            <p>观看视频，听我讲解古代计时的秘密</p>
        </div>

        <div class="main-area">
            <!-- 日晷视频区域 -->
            <div class="stage" id="stage">
                
                
                <!-- ====================== 视频位置 ====================== -->
             
                <div class="video-placeholder">
                  <video width="400" height="300" controls muted>
    <source src="日晷运动.mp4" type="video/mp4">
</video>
                </div>
                <!-- ===================================================== -->

            </div>

            <!-- 按钮区域（样式完全不变） -->
            <div class="magnet-control">
                <div class="control-buttons">
                    <button id="resetBtn">刷新视频</button>
                    <button id="explainBtn">听我讲解</button>
                </div>
            </div>
        </div>

        <!-- 讲解弹窗（第一人称：日晷） -->
        <div class="dialogue-box" id="dialogueBox">
            <p class="dialogue-text" id="dialogueText">
                大家好！我是日晷，古代的“光传感器”。我能感知太阳光的照射方向与位置变化，就像今天的光敏传感器一样，
                把看不见的光照信号，转换成能直接使用的时间信息。<br><br>
                我由晷盘和晷针组成，太阳照在我身上，晷针的影子会随着太阳移动，指向不同的时辰，古人就是靠我来判断时间的！
            </p>
        </div>

        <!-- 教学目标 -->
        <div class="target-card">
            <h3>教学目标</h3>
            <p>理解“感知光照信号 → 转化为时间信息”的传感器逻辑，认识日晷作为古代光传感器的工作原理，体会古人利用自然规律的智慧。</p>
        </div>
    </div>

    <!-- 语音合成（完全保留原逻辑） -->
    <script>
        const stage = document.getElementById('stage');
        const resetBtn = document.getElementById('resetBtn');
        const explainBtn = document.getElementById('explainBtn');
        const dialogueBox = document.getElementById('dialogueBox');
        const dialogueText = document.getElementById('dialogueText');

        // 点击区域弹出讲解
        stage.addEventListener('click', () => {
            showDialogue();
        });

        // 刷新视频按钮
        resetBtn.addEventListener('click', () => {
            window.location.reload();
        });

        // 讲解按钮
        function showDialogue() {
            dialogueBox.classList.add('show');
            speakText(dialogueText.textContent);
        }

        explainBtn.addEventListener('click', showDialogue);

        // 语音朗读
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
